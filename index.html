<style>
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #222;
    --border: rgba(255,255,255,0.08); --text: #e8e8e6;
    --muted: #888; --faint: #555;
    --green: #1D9E75; --pink: #D4537E; --purple: #7F77DD;
    --blue: #378ADD; --amber: #EF9F27; --red: #E24B4A;
    --gray: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.5; padding: 24px; max-width: 1100px; margin: 0 auto; overflow-y: auto; }
  .page-header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .page-header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .page-header p { color: var(--muted); font-size: 12px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media(max-width:700px) {
    .kpi-grid { grid-template-columns: repeat(2,1fr); }
    .two-col, .three-col { grid-template-columns: 1fr; }
    .thumb-grid { grid-template-columns: repeat(3,1fr); }
    .bar-row .lbl { flex: 0 0 110px; }
    .donut-section { flex-direction: column; align-items: flex-start; }
    body { padding: 16px; }
  }
  .kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .kpi .label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .kpi .value { font-size: 24px; font-weight: 600; color: #fff; line-height: 1; }
  .kpi .delta { font-size: 11px; margin-top: 5px; }
  .up { color: var(--green); } .down { color: var(--red); } .neu { color: var(--muted); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .bar-row .lbl { flex: 0 0 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-val { flex: 0 0 50px; text-align: right; color: #fff; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { font-size: 10px; font-weight: 600; color: var(--faint); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.06em; text-transform: uppercase; }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-red    { background: rgba(226,75,74,0.15);   color: #f08080; }
  .badge-yellow { background: rgba(239,159,39,0.15);  color: #f0b060; }
  .badge-green  { background: rgba(29,158,117,0.15);  color: #5dcaa5; }
  .badge-blue   { background: rgba(55,138,221,0.15);  color: #85b7eb; }
  .badge-gray   { background: rgba(136,135,128,0.2);  color: #aaa;    }
  .stat-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; flex-wrap: wrap; }
  .stat-row:last-child { border-bottom: none; }
  .stat-val { font-weight: 600; color: #fff; flex-shrink: 0; }
  .chart-wrap { position: relative; width: 100%; height: 160px; }
  .vitals-bar { height: 6px; border-radius: 3px; overflow: hidden; display: flex; margin-bottom: 8px; }
  .type-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .type-lbl { width: 60px; font-size: 12px; color: var(--muted); }
  .type-pct { width: 36px; text-align: right; font-size: 12px; font-weight: 600; color: #fff; }
  .thumb-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .thumb { background: var(--bg3); border-radius: 6px; padding: 10px 8px; text-align: center; }
  .thumb .tv { font-size: 16px; font-weight: 700; color: #fff; }
  .thumb .td { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .thumb .tt { font-size: 10px; color: var(--faint); }
  .hours-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }

  .hours-val { width: 30px; text-align: right; font-size: 11px; font-weight: 600; color: #fff; }
  .donut-section { display: flex; align-items: center; gap: 20px; }
  .donut-wrap { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); text-align: center; }
</style>
</head>

<script>
const COR = { purple: 'var(--purple)', pink: 'var(--pink)', blue: 'var(--blue)', green: 'var(--green)', amber: 'var(--amber)', gray: '#555' };

function kpi(label, obj) {
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${obj.valor}</div><div class="delta ${obj.tipo}">${obj.delta}</div></div>`;
}
function barRow(item) {
  const cor = COR[item.cor] || 'var(--purple)';
  return `<div class="bar-row"><span class="lbl">${item.nome}</span><div class="bar-track"><div class="bar-fill" style="width:${item.pct}%;background:${cor};"></div></div><span class="bar-val">${item.val}</span></div>`;
}
function typeRow(item) {
  const cor = COR[item.cor] || 'var(--pink)';
  return `<div class="type-row"><span class="type-lbl">${item.nome}</span><div class="bar-track" style="flex:1;"><div class="bar-fill" style="width:${item.pct}%;background:${cor};"></div></div><span class="type-pct">${item.pct}%</span></div>`;
}
function thumb(item) {
  return `<div class="thumb"><div class="tv">${item.val}</div><div class="td">${item.data}</div><div class="tt">${item.tipo}</div></div>`;
}

const E = D.ecommerce, R = D.rd, I = D.instagram, C = D.clarity;

<div class="page-header">

</div>

  </div>
</div>

<style>
  :root {
    --bg: #191919; --bg2: #222222; --bg3: #2a2a2a;
    --border: rgba(255,255,255,0.08); --text: #e8e8e6;
    --muted: #888; --faint: #555;
    --green: #1D9E75; --pink: #D4537E; --purple: #7F77DD;
    --blue: #378ADD; --amber: #EF9F27; --red: #E24B4A;
    --gray: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.5; padding: 24px; max-width: 1100px; margin: 0 auto; overflow-y: auto; }
  .page-header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .page-header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .page-header p { color: var(--muted); font-size: 12px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpi-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media(max-width:700px) {
    .kpi-grid, .kpi-grid-2 { grid-template-columns: repeat(2,1fr); }
    .two-col, .three-col { grid-template-columns: 1fr; }
    .bar-row .lbl { flex: 0 0 110px; }
    body { padding: 16px; }
  }
  .kpi { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .kpi .label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .kpi .value { font-size: 24px; font-weight: 600; color: #fff; line-height: 1; }
  .kpi .delta { font-size: 11px; margin-top: 5px; }
  .up { color: var(--green); } .down { color: var(--red); } .neu { color: var(--muted); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .bar-row .lbl { flex: 0 0 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-val { flex: 0 0 70px; text-align: right; color: #fff; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { font-size: 10px; font-weight: 600; color: var(--faint); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.06em; text-transform: uppercase; }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-red    { background: rgba(226,75,74,0.15);   color: #f08080; }
  .badge-yellow { background: rgba(239,159,39,0.15);  color: #f0b060; }
  .badge-green  { background: rgba(29,158,117,0.15);  color: #5dcaa5; }
  .badge-blue   { background: rgba(55,138,221,0.15);  color: #85b7eb; }
  .badge-gray   { background: rgba(136,135,128,0.2);  color: #aaa;    }
  .badge-orange { background: rgba(239,100,39,0.2);   color: #f09060; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; flex-wrap: wrap; }
  .stat-row:last-child { border-bottom: none; }
  .stat-val { font-weight: 600; color: #fff; flex-shrink: 0; }
  .chart-wrap { position: relative; width: 100%; height: 180px; }
  .chart-wrap-sm { position: relative; width: 100%; height: 140px; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); text-align: center; }
  .alert-note { background: rgba(226,75,74,0.08); border: 1px solid rgba(226,75,74,0.25); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #f08080; margin-top: 10px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const COR = { purple: 'var(--purple)', pink: 'var(--pink)', blue: 'var(--blue)', green: 'var(--green)', amber: 'var(--amber)', gray: '#555' };

function kpi(label, obj) {
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${obj.valor}</div><div class="delta ${obj.tipo}">${obj.delta}</div></div>`;
}
function barRow(item) {
  const cor = COR[item.cor] || 'var(--purple)';
  return `<div class="bar-row"><span class="lbl">${item.nome}</span><div class="bar-track"><div class="bar-fill" style="width:${item.pct}%;background:${cor};"></div></div><span class="bar-val">${item.val}</span></div>`;
}

const D = DADOS;
const E = D.ecommerce, R = D.rd, H = D.historico;

document.getElementById('app').innerHTML = `
<div class="page-header">
  <h1>📊 Dashboard de Marketing</h1>
  <p>Período: ${D.periodo} &nbsp;·&nbsp; Atualizado em: ${D.atualizadoEm}</p>
</div>

<div class="section-title">🛒 E-commerce — Tray (Abril/2026)</div>
<div class="kpi-grid">
  ${kpi('Receita total', E.receita)}
  ${kpi('Vendas realizadas', E.vendas)}
  ${kpi('Visitas à loja', E.visitas)}
  ${kpi('Conversão loja', E.conversao)}
</div>

<div class="two-col" style="margin-top:8px;">
  <div class="card">
    <div class="card-title">Mais vendidos</div>
    ${E.maisVendidos.map(barRow).join('')}
  </div>
  <div class="card">
    <div class="card-title">Status dos pedidos</div>
    ${E.statusPedidos.map(p => `<div class="stat-row"><span>${p.nome}</span><span class="stat-val"><span class="badge badge-${p.badge}">${p.texto}</span></span></div>`).join('')}
    <div style="margin-top:12px;font-size:11px;color:var(--faint);">${E.statusRodape}</div>
  </div>
</div>

<div class="two-col" style="margin-top:8px;">
  <div class="card">
    <div class="card-title">Categorias mais visitadas</div>
    ${E.maisVistos.map(barRow).join('')}
  </div>
  <div class="card">
    <div class="card-title">Termos mais buscados</div>
    ${E.buscas.map(b => `<div class="bar-row"><span class="lbl">${b.nome}</span><div class="bar-track"><div class="bar-fill" style="width:${b.pct}%;background:var(--green);"></div></div><span class="bar-val">${b.val}</span></div>`).join('')}
  </div>
</div>

<div class="two-col" style="margin-top:8px;">
  <div class="card">
    <div class="card-title">Receita mensal (R$) — 2026</div>
    <div class="chart-wrap"><canvas id="receitaChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Visitas mensais — 2026</div>
    <div class="chart-wrap"><canvas id="visitasChart"></canvas></div>
  </div>
</div>

<div class="section-title">📧 E-mail Marketing — Abril/2026</div>
<div class="card">
  <div class="card-title">Campanhas de abril</div>
  <table>
    <thead><tr><th>Campanha</th><th>Data</th><th>Enviados</th><th>Entrega</th><th>Abertura</th><th>Cliques</th><th>Bounces</th></tr></thead>
    <tbody>
      ${D.email.campanhasAbril.map(c => `
        <tr>
          <td>${c.nome} ${c.status === 'bloqueada' ? '<span class="badge badge-red">Bloqueada</span>' : ''}</td>
          <td style="color:var(--muted);">${c.data}</td>
          <td>${c.enviados.toLocaleString('pt-BR')}</td>
          <td>${c.entrega}</td>
          <td>${c.abertura}</td>
          <td>${c.cliques}</td>
          <td style="color:${c.status === 'bloqueada' ? 'var(--red)' : 'var(--muted)'};">${c.bounces.toLocaleString('pt-BR')}</td>
        </tr>`).join('')}
    </tbody>
  </table>
  <div class="alert-note">⚠ A campanha "BiiO & Tech" (2.915 e-mails) foi bloqueada por alto índice de hard bounces (11,60%). Taxa de bounce total da campanha bloqueada: 44,84%.</div>
</div>

<div class="card" style="margin-top:8px;">
  <div class="card-title">Histórico de campanhas anteriores</div>
  <table>
    <thead><tr><th>Campanha</th><th>Data</th><th>Enviados</th><th>Entrega</th><th>Abertura</th><th>Cliques</th><th>Bounces</th></tr></thead>
    <tbody>
      ${D.email.historico.map(c => `
        <tr>
          <td>${c.nome}</td>
          <td style="color:var(--muted);">${c.data}</td>
          <td>${c.enviados.toLocaleString('pt-BR')}</td>
          <td>${c.entrega}</td>
          <td>${c.abertura}</td>
          <td>${c.cliques}</td>
          <td style="color:var(--muted);">${c.bounces}</td>
        </tr>`).join('')}
    </tbody>
  </table>
</div>

<div class="section-title">📡 RD Station — Leads (Abril/2026)</div>
<div class="kpi-grid-2">
  ${kpi('Leads — pop-up site', R.leadsPopup)}
  ${kpi('Leads — WhatsApp', R.leadsWhatsapp)}
</div>
<div class="card" style="margin-top:8px;">
  <div class="card-title">Histórico de leads mensais — 2026</div>
  <div class="chart-wrap-sm"><canvas id="leadsChart"></canvas></div>
</div>

<div class="section-title">🚨 Alertas e Oportunidades</div>
<div class="card">
  <table>
    <thead><tr><th>Situação</th><th>Prioridade</th><th>Ação sugerida</th></tr></thead>
    <tbody>
      ${D.alertas.map(a => `<tr><td style="color:var(--muted);">${a.situacao}</td><td><span class="badge badge-${a.badge}">${a.prioridade}</span></td><td>${a.acao}</td></tr>`).join('')}
    </tbody>
  </table>
</div>

<footer>Dashboard de Marketing · Gerado em ${D.atualizadoEm} · Para atualizar os dados, edite a seção DADOS no topo do arquivo HTML</footer>
`;

const green = '#1D9E75', pink = '#D4537E', purple = '#7F77DD', amber = '#EF9F27';
const gridColor = 'rgba(255,255,255,0.06)', tickColor = 'rgba(255,255,255,0.35)';
const commonScales = {
  x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } },
  y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
};

new Chart(document.getElementById('receitaChart'), {
  type: 'bar',
  data: {
    labels: H.labels,
    datasets: [{ label: 'Receita (R$)', data: H.receitas, backgroundColor: [purple+'88', purple+'88', purple+'88', green+'cc'], borderColor: [purple, purple, purple, green], borderWidth: 1, borderRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: commonScales }
});

new Chart(document.getElementById('visitasChart'), {
  type: 'bar',
  data: {
    labels: H.labels,
    datasets: [{ label: 'Visitas', data: H.visitas, backgroundColor: [pink+'55', pink+'55', pink+'55', amber+'99'], borderColor: [pink, pink, pink, amber], borderWidth: 1, borderRadius: 4 }]
  },
  options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: commonScales }
});

new Chart(document.getElementById('leadsChart'), {
  type: 'line',
  data: {
    labels: DADOS.rd.leadsHistorico.labels,
    datasets: [
      { label: 'Pop-up', data: DADOS.rd.leadsHistorico.popup, borderColor: pink, backgroundColor: pink+'22', fill: true, tension: 0.4, pointRadius: 4, borderWidth: 2 },
      { label: 'WhatsApp', data: DADOS.rd.leadsHistorico.whatsapp, borderColor: green, backgroundColor: green+'22', fill: true, tension: 0.4, pointRadius: 4, borderWidth: 2 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: tickColor, font: { size: 11 }, boxWidth: 10 } } },
    scales: commonScales
  }
});
</script>
</body>
</html>
